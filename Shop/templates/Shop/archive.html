<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив товаров</title>
</head>
<body>
    <h1>Хронологический список товаров</h1>

    {% if products %}
        <ul>
            {% for product in products %}
                <li>
                    {{ product.created_at|date:"d.m.Y H:i" }} —
                    <a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a>
                    — {{ product.price }} ₸
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Товаров пока нет.</p>
    {% endif %}

    <a href="{% url 'product_list' %}">← Назад к списку</a>
</body>
</html>
