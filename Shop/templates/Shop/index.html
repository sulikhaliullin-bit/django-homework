<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список товаров</title>
</head>
<body>
    <h1>Список товаров</h1>

    {% if products %}
        <ul>
            {% for product in products %}
                <li>{{ product.name }} — {{ product.price }} ₸</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Товаров пока нет.</p>
    {% endif %}

    <a href="{% url 'manage_products' %}">+ Добавить / редактировать</a>
</body>
</html>
