<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список уроков</title>
</head>
<body>
    <h1>Список уроков</h1>

    <!-- Этот блок выводит данные из базы[cite: 1, 2] -->
    <ul>
        {% for course in courses %}
            <li>
                <strong>{{ course.title }}</strong> — {{ course.description }}
            </li>
        {% empty %}
            <li>Пока курсов нет. Добавьте их через форму!</li>
        {% endfor %}
    </ul>

    <br>
    <!-- Ссылка для возврата к форме создания -->
    <a href="{% url 'create_course' %}">Добавить новый курс</a>
</body>
</html>
